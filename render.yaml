services:
  - type: web
    name: kaamsathi-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://kaamsathi-web.onrender.com

  - type: web
    name: kaamsathi-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kaamsathi-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
