server.port=${PORT:5000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kaamsathi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
kaamsathi.jwt-secret=${JWT_SECRET}
kaamsathi.admin-setup-key=${ADMIN_SETUP_KEY}
kaamsathi.cors-origin=${CORS_ORIGIN:http://localhost:5173}
